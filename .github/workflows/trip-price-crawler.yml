name: Trip Price Task Builder

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 09:00 Asia/Taipei，每天執行 Step 1 結構／查價任務維護
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  trip-price-task-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install playwright patchright groq fast-flights

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Install Patchright Chromium
        run: patchright install chromium --with-deps

      - name: Step 1 — Build structure and price task rows
        id: step1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
        run: python crawlers/trip_price/crawler.py

      # Step 2 — Touch trigger property for optional Notion AI/manual follow-up.
      # 2026-08-06 起 Step 3 已改為 15 個平台全部嘗試 Playwright + Groq 查價；
      # Notion AI 不再固定負責特定平台，只作為補查與修正輔助。
      - name: Step 2 — Touch trigger property for follow-up
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
        run: |
          if [ "${{ steps.step1.outcome }}" != "success" ]; then
            echo "Step 1 失敗，略過觸發，請檢查 GitHub Actions 記錄"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Skip: 節省 Notion AI credit，只在週一或手動觸發時通知 Agent"
            exit 0
          fi
          python crawlers/trip_price/crawler.py --touch-trigger

      # Step 3 — Playwright 實測開頁擷取 + Groq 正規化。
      # 2026-08-06 起改為全部 15 個平台都嘗試：Google Flights / Skyscanner / Trip.com / KAYAK /
      # Expedia / momondo / Booking.com / ezTravel / EVA / 華航 / 星宇 / AirAsia / Kiwi / Traveloka / Airpaz。
      # 抓不到的列會寫 confidence=0 與原因，保留待 Notion AI / 人工補查。
      - name: Step 3 — Playwright + Groq price fetch for all platforms
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 選填：代理伺服器掛鉤（2026-08-08 新增）。未建立這三個 repo secret 時會解析成空字串，
          # crawler.env() 已把空字串當未設定處理，不影響現有行為。
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
          SCRAPE_PROXY_USERNAME: ${{ secrets.SCRAPE_PROXY_USERNAME }}
          SCRAPE_PROXY_PASSWORD: ${{ secrets.SCRAPE_PROXY_PASSWORD }}
        run: |
          if [ "${{ steps.step1.outcome }}" != "success" ]; then
            echo "Step 1 失敗，略過 Step 3，請檢查 GitHub Actions 記錄"
            exit 0
          fi
          python crawlers/trip_price/ai_price.py
