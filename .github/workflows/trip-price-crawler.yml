name: Trip Price Crawler

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 09:00 Asia/Taipei
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  trip-price-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Step 1 — Rebuild structure rows (flights + price sites)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
        run: python crawlers/trip_price/crawler.py

      # Step 2 票價查詢改由 Notion AI 手動執行，不在此自動化
      # 使用方式：直接向 Notion AI 說「更新 XXX 的票價」即可
