name: Trip Price Crawler

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 09:00 Asia/Taipei，每天執行（只跑 Step 1 結構維護，0 credit）
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  trip-price-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Step 1 — Rebuild structure rows (flights + price sites)
        id: step1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
        run: python crawlers/trip_price/crawler.py

      # Step 2 — 觸發 Notion AI 抓票價（會用到 Notion AI credit）
      # 為節省 credit，只在以下情況執行：
      #   1. 每週一（自動，每週只用 1 次 credit）
      #   2. 手動 Run workflow（想更新票價時隨時可觸發）
      - name: Step 2 — Notify Notion AI Agent (weekly or manual only)
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PRICE_LOG_DB_ID: ${{ secrets.NOTION_PRICE_LOG_DB_ID }}
        run: |
          # 只在週一或手動觸發時執行，其餘日子直接跳過（省 credit）
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Skip: 節省 Notion AI credit，只在週一或手動觸發時通知 Agent"
            exit 0
          fi
          STATUS="✅ 成功"
          NOTE="Step 1 完成，觸發 Notion AI 抓取票價"
          if [ "${{ steps.step1.outcome }}" != "success" ]; then
            STATUS="❌ 失敗"
            NOTE="Step 1 失敗，請檢查 GitHub Actions 記錄"
          fi
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -s -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"parent\": { \"database_id\": \"${NOTION_PRICE_LOG_DB_ID}\" },
              \"properties\": {
                \"\u57f7\u884c\u6642\u9593\": {
                  \"title\": [{ \"text\": { \"content\": \"${NOW}\" } }]
                },
                \"\u72c0\u614b\": {
                  \"select\": { \"name\": \"${STATUS}\" }
                },
                \"\u5099\u8a3b\": {
                  \"rich_text\": [{ \"text\": { \"content\": \"${NOTE}\" } }]
                }
              }
            }"
