name: Trip Price Crawler

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 09:00 Asia/Taipei，每天執行（只跑 Step 1 結構維護，0 credit）
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  trip-price-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Step 1 — Rebuild structure rows (flights + price sites)
        id: step1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
        run: python crawlers/trip_price/crawler.py

      # Step 2 — 觸發 Notion AI Agent 查價（會用到 Notion AI credit）
      # 2026-08-04 起改為直接更新「航班追蹤」子 database 的「上次觸發時間」屬性，
      # 不再另外寫「GitHub Actions 執行日誌」資料庫；Notion 端 Agent 監看該屬性變更即會自動觸發。
      # 為節省 credit，只在以下情況執行：
      #   1. 每週一（自動，每週只用 1 次 credit）
      #   2. 手動 Run workflow（想更新票價時隨時可觸發）
      - name: Step 2 — Touch trigger property (weekly or manual only)
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
        run: |
          if [ "${{ steps.step1.outcome }}" != "success" ]; then
            echo "Step 1 失敗，略過觸發，請檢查 GitHub Actions 記錄"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Skip: 節省 Notion AI credit，只在週一或手動觸發時通知 Agent"
            exit 0
          fi
          python crawlers/trip_price/crawler.py --touch-trigger
