name: Trip Price Task Builder

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 09:00 Asia/Taipei，每天執行 Step 1 結構／查價任務維護
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  trip-price-task-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install playwright groq

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Step 1 — Build structure and price task rows
        id: step1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
        run: python crawlers/trip_price/crawler.py

      # Step 2 — 觸發 Notion AI Agent 查價（會用到 Notion AI credit）
      # GitHub Actions 不再直接解析即時票價；只建立可查價 task rows 與正確訂票連結。
      # 為節省 credit，只在以下情況執行：
      #   1. 每週一（自動，每週只用 1 次 credit）
      #   2. 手動 Run workflow（想更新票價時隨時可觸發）
      - name: Step 2 — Touch trigger property for Notion AI pricing
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
        run: |
          if [ "${{ steps.step1.outcome }}" != "success" ]; then
            echo "Step 1 失敗，略過觸發，請檢查 GitHub Actions 記錄"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Skip: 節省 Notion AI credit，只在週一或手動觸發時通知 Agent"
            exit 0
          fi
          python crawlers/trip_price/crawler.py --touch-trigger

      # Step 3 — Playwright 實測開頁擷取 + Groq 正規化，補上 Notion AI Agent 查不到精確價的動態渲染平台
      # （Google Flights / Skyscanner / Trip.com / KAYAK / Expedia / momondo / Booking.com / ezTravel /
      # 中華航空 / 星宇航空 / AirAsia，完整清單見 crawlers/trip_price/browser_fetch.py 的 PLATFORM_CONFIG）。
      # 其餘平台（Kiwi.com、Traveloka、Airpaz、EVA Air 等）仍交由 Step 2 的 Notion AI Agent 查價，不受影響。
      - name: Step 3 — Playwright + Groq price fetch for target platforms
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TRIP_DATABASE_ID: ${{ secrets.TRIP_DATABASE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ steps.step1.outcome }}" != "success" ]; then
            echo "Step 1 失敗，略過 Step 3，請檢查 GitHub Actions 記錄"
            exit 0
          fi
          python crawlers/trip_price/ai_price.py
