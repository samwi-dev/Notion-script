name: Crawl news to Notion

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = 台北時間 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run crawler
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CONFIG_DB_ID: ${{ secrets.CONFIG_DB_ID }}
        run: python crawler.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json
          git diff --cached --quiet || (git commit -m "chore: update seen_urls [skip ci]" && git push)
